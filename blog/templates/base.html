<!DOCTYPE html>
<html lang="en" prefix="og: https://ogp.me/ns#">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
        <title>{% block title %}Blog | GrapheneOS{% endblock title %}</title>
        [[css|/main.css]]
        <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}"/>
        <meta name="theme-color" content="#212121"/>
        <meta name="color-scheme" content="dark light"/>
        <meta name="twitter:site" content="@GrapheneOS"/>
        <meta name="twitter:creator" content="@GrapheneOS"/>
        <meta property="og:title" content="{% block og_title %}{{ config.title }}{% endblock og_title %}"/>
        <meta property="og:description" content="{% block og_desc %}{{ config.description }}{% endblock og_desc %}"/>
        <meta property="og:type" content="website"/>
        <meta property="og:image" content="https://grapheneos.org/opengraph.png"/>
        <meta property="og:image:width" content="512"/>
        <meta property="og:image:height" content="512"/>
        <meta property="og:image:alt" content="GrapheneOS logo"/>
        <meta property="og:site_name" content="GrapheneOS"/>
        {% block og_url %}<meta property="og:url" content="{{ current_url }}"/>{% endblock og_url %}
        {% block canonical_url %}<link rel="canonical" href="{{ config.extra.blog_canonical ~ current_path }}" />{% endblock canonical_url %}
        <link rel="alternate" type="application/atom+xml" href="/blog/atom.xml"/>
        <link rel="icon" href="/favicon.ico"/>
        <link rel="icon" sizes="any" type="image/svg+xml" href="/favicon.svg"/>
        <link rel="mask-icon" href="[[path|/mask-icon.svg]]" color="#1a1a1a"/>
        <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
        <link rel="manifest" href="/manifest.webmanifest"/>
        <link rel="license" href="/LICENSE.txt"/>
        <link rel="me" href="https://grapheneos.social/@GrapheneOS"/>
    </head>
    <body>
        {% set current_page = "blog" %}
        {% include "header.html" %}

        {% block content %}{% endblock content %}

        {% include "footer.html" %}
    </body>
</html>
